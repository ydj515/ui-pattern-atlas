    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      // Keep the key in sync with THEME_STORAGE_KEY in src/features/switch-theme/model/theme.ts.
      (function () {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var preference = "system";
        try {
          preference = localStorage.getItem("ui-pattern-atlas:theme") || "system";
        } catch (error) {}
        var dark = preference === "dark" || (preference !== "light" && prefersDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
