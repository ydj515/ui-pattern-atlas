name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress deployment finish; queue the next one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fail instead of resolving tools missing from mise.lock.
      MISE_LOCKED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.9
          install: true
          cache: true

      - name: Verify
        run: mise run verify

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build for Pages
        run: mise run build
        env:
          # "/<repo>" for project sites, "" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
