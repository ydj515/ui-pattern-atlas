name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Fail instead of resolving tools missing from mise.lock.
      MISE_LOCKED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.9
          install: true
          cache: true

      - name: Verify
        run: mise run verify
