name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress deployment finish; queue the next one instead of cancelling it.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only main of this repository: never forks, pull requests or other branches.
    # The production environment also admits only main, and CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID are secrets of that environment, not of the repository, so they
    # stay out of reach even if a pull request edits this file.
    if: github.repository == 'ydj515/ui-pattern-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ui-pattern-atlas.pages.dev/
    env:
      # Fail instead of resolving tools missing from mise.lock.
      MISE_LOCKED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.9
          install: true
          cache: true

      # Verify also builds the site into dist/ at the root path, which is what Pages serves.
      - name: Verify
        run: mise run verify

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ui-pattern-atlas --branch=main
